<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Architecture du suivi de candidatures</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2a37"/>
    </marker>
  </defs>
  <rect width="1000" height="480" fill="#ffffff"/>

  <!-- Navigateur -->
  <rect x="20" y="20" width="400" height="440" rx="14" fill="#f3f7fb" stroke="#9db3c8" stroke-width="1.5"/>
  <text x="40" y="48" font-size="15" font-weight="700" fill="#1f2a37">Navigateur (GitHub Pages)</text>

  <rect x="50" y="70" width="340" height="70" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="220" y="100" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a37">SecretGate</text>
  <text x="220" y="122" font-size="12.5" text-anchor="middle" fill="#5b6b7c">lit ?key=… dans l'adresse, vérifie l'accès</text>

  <rect x="50" y="170" width="340" height="270" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="220" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a37">Interface React (Vite)</text>
  <g font-size="12.5" text-anchor="middle" fill="#5b6b7c">
    <text x="220" y="226">Composants : App · Dashboard · ApplicationCard</text>
    <text x="220" y="246">InterviewPrep · KnowledgeBase · KnowledgeProvider</text>
    <text x="220" y="262">Hooks : useApplications · useTodos · useSplit</text>
  </g>
  <rect x="72" y="278" width="296" height="150" rx="8" fill="#fff7ec" stroke="#b5651d" stroke-width="1"/>
  <text x="220" y="296" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2a37">helpers/api.ts</text>
  <g font-size="12.5" text-anchor="middle" fill="#5b6b7c">
    <text x="220" y="322">abonnements onSnapshot (temps réel)</text>
    <text x="220" y="344">saveApplication · saveTodos · saveAnswer</text>
    <text x="220" y="372" font-weight="700" fill="#1f2a37">helpers/firestore.ts</text>
    <text x="220" y="394">chemin vault/&lt;secret&gt;/… ; secret en mémoire</text>
  </g>

  <line x1="220" y1="140" x2="220" y2="168" stroke="#1f2a37" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Firestore -->
  <path d="M540 150 v200 c0 18 55 28 110 28 s110 -10 110 -28 v-200 c0 -18 -55 -28 -110 -28 s-110 10 -110 28 z" fill="#eaf5ea" stroke="#4a8a4a" stroke-width="1.5"/>
  <ellipse cx="650" cy="150" rx="110" ry="28" fill="#d6ecd6" stroke="#4a8a4a" stroke-width="1.5"/>
  <text x="650" y="155" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a37">Firestore</text>
  <g font-size="12.5" text-anchor="middle" fill="#1f2a37">
    <text x="650" y="205" font-weight="700">vault/&lt;secret&gt;/</text>
    <text x="650" y="235" fill="#5b6b7c">applications/&lt;slug&gt;</text>
    <text x="650" y="258" fill="#5b6b7c">meta/todos · meta/…</text>
    <text x="650" y="281" fill="#5b6b7c">answers/&lt;fiche&gt;</text>
    <text x="650" y="304" fill="#5b6b7c">kb · qcm · openQuestions · cv</text>
  </g>
  <text x="650" y="340" font-size="11.5" text-anchor="middle" fill="#5b6b7c">règles : secret comparé côté Firebase</text>

  <!-- Poste local -->
  <rect x="860" y="130" width="120" height="240" rx="14" fill="#f3f7fb" stroke="#9db3c8" stroke-width="1.5"/>
  <text x="920" y="156" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2a37">Poste local</text>
  <rect x="872" y="176" width="96" height="170" rx="9" fill="#fdf0f0" stroke="#b04a4a" stroke-width="1.5"/>
  <g font-size="12" text-anchor="middle" fill="#1f2a37">
    <text x="920" y="202" font-weight="700">outils/</text>
    <text x="920" y="224" font-weight="700">firebase/</text>
    <text x="920" y="246" font-weight="700">db.mjs</text>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#5b6b7c">
    <text x="920" y="276">list · get · set</text>
    <text x="920" y="294">merge · put</text>
    <text x="920" y="312">delete · import-kb</text>
    <text x="920" y="334">(Claude Code)</text>
  </g>

  <!-- Flèches -->
  <g stroke="#1f2a37" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M390 310 H530"/>
    <path d="M530 270 H460 V270 H392" />
    <path d="M868 260 H770" marker-start="url(#arrow)"/>
  </g>
  <text x="460" y="302" font-size="11.5" text-anchor="middle" fill="#1f2a37">écritures (merge)</text>
  <text x="460" y="262" font-size="11.5" text-anchor="middle" fill="#1f2a37">lectures en direct</text>

  <!-- Déploiement -->
  <rect x="470" y="400" width="400" height="60" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="670" y="425" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2a37">GitHub Actions</text>
  <text x="670" y="445" font-size="11.5" text-anchor="middle" fill="#5b6b7c">push sur main : pnpm build → publie candidatures/dist</text>
</svg>
